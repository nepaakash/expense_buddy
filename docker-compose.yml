version: "3.8"

services:

  db:
      image: postgres:14
      volumes:
        - "db_data:/var/lib/postgresql/data"
      restart: always
      environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: Kathmandu@321  # Ensure this is set
        POSTGRES_DB: expense_buddy

      ports:
      - "5432:5432"

  app:
    build: .
    container_name: expense_buddy
    ports: 
      - "3000:3000"
    volumes:
      - bundle_data:/usr/local/bundle
      - .:/expense_buddy

    depends_on: [db]
    command: ["./bin/rails", "server", "-b", "0.0.0.0"]
    environment:
      DB_HOST: db
      DB_USERNAME: postgres
      DB_PASSWORD: Kathmandu@321
      DB_NAME: expense_buddy
      DB_PORT: 5432


volumes:
  bundle_data:
  db_data: